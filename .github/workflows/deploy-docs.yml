name: Publish Documentation
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Stage documentation
        run: |
             mkdir -p docs
             cp README.md docs/
             cp -r Tutorials docs/ 2>/dev/null || true
             cp -r Products docs/ 2>/dev/null || true
             cp -r Services docs/ 2>/dev/null || true
             cp -r Projects docs/ 2>/dev/null || true
             cp -r Contact-Us docs/ 2>/dev/null || true
             cp "Orbit-Q Datasheet.pdf" docs/ 2>/dev/null || true
             cp -r images docs/ 2>/dev/null || true
      - name: Build documentation
        run: mkdocs build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
